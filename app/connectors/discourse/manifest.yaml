# Discourse (any forum): one connector, many forums. destination.instance.base_url = the forum root,
# destination.instance.category_id = the category to post in (optional; the forum default otherwise).
# Facts below were measured on discourse/discourse:2026.10.0-latest (tests/fixtures/recorded/discourse).
key: discourse
version: 1.0.0
tier: native
auth: api_key             # credentials: api_key (+ api_username, default "system")
surfaces:
  - key: topic
    content_types: [text, link, image, video_link]
    # Defaults of a stock forum: min_topic_title_length 15, max_topic_title_length 255,
    # min_first_post_length 20, max_post_length 32000. Override per forum with destination.spec_overrides.
    spec: {title_required: true, title_min_chars: 15, title_max_chars: 255, body_required: true,
           body_min_chars: 20, body_max_chars: 32000, count_unit: codepoints, links_allowed: true}
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}   # admin API default limit is 60 requests/minute
capabilities: [publish, status, delete, metrics]
error_map:
  "403:invalid_access": CONNECTION_AUTH_EXPIRED   # measured: unknown or revoked key -> 403 error_type invalid_access
  "403": CONNECTION_AUTH_EXPIRED
  "401": CONNECTION_AUTH_EXPIRED
  "400:invalid_parameters": PLATFORM_CONTENT_REJECTED
  "400": PLATFORM_CONTENT_REJECTED
  "422": PLATFORM_CONTENT_REJECTED                # measured: 422 {"action":"create_post","errors":[...]}
  "429": PLATFORM_RATE_LIMIT                      # Retry-After + extras.wait_seconds
instance_param: base_url
