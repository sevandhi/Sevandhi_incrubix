  - id: c07
    split: dev
    group: on_topic
    audiences: [saas]
    title: "How we automated client onboarding with n8n and a no-code CRM"
    body: |
      Our onboarding used to be eleven manual steps. We rebuilt it as one n8n workflow: a form submission creates the
      CRM record, a shared folder, a kickoff calendar invite and a welcome email, with a Slack message when anything
      fails. The workflow JSON is attached. Lessons: keep credentials in n8n's credential store and add error
      branches early.
    content_type: text
    tags: [n8n, automation, no-code, saas, crm]
    language: en
    is_promotional: false
    ai_generated: false

