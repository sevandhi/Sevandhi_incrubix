# OUT1 evaluation set: 20 content items written for this evaluation (our own text, never posted anywhere).
# 14 on-topic items across the six audiences (AI, video, marketing, SaaS, creators, founders), 3 off-topic items,
# 3 non-English items. The split (dev = weights may be tuned on these; test = reported once) was fixed here before
# any label was written: each audience has one item on each side.
# Fields follow ContentIn (app/catalogue/models.py), plus id, split, group and audiences (for reporting only; the
# recommender never reads `group` or `audiences`).
version: 1
items:
  - id: c01
    split: dev
    group: on_topic
    audiences: [ai]
    title: "Running a 7B model locally for subtitle generation: what we measured"
    body: |
      We replaced a hosted speech-to-text API with Whisper plus a local 7B LLM that cleans up punctuation and
      speaker turns. On a 16-core laptop CPU, a 10-minute clip takes 4 minutes end to end. Word error rate went from
      7.9% to 8.4%, and the cost went to zero. Quantised 4-bit weights were good enough; 3-bit started dropping names.
      The post includes the exact Ollama model tags, prompts and the evaluation script. What local setups are you
      using for transcription?
    content_type: text
    tags: [llm, local-ai, ollama, whisper, transcription]
    language: en
    is_promotional: false
    ai_generated: false

  - id: c02
    split: test
    group: on_topic
    audiences: [ai]
    title: "Prompt patterns that halved our AI image generation retries"
    body: |
      We generate thumbnails with Stable Diffusion XL and ComfyUI. Most failed images came from three prompt habits:
      stacking styles, negative prompts that fight the positive one, and asking for readable text. Fixing those cut
      retries from 3.1 to 1.4 per image. This write-up was drafted with an AI assistant and edited by us; the example
      prompts, seeds and before/after grids are in the post.
    content_type: text
    tags: [ai, stable-diffusion, comfyui, image-generation, prompts]
    language: en
    is_promotional: false
    ai_generated: true

