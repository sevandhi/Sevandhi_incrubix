    title: "Colour grading in DaVinci Resolve vs Kdenlive: a 10-minute side-by-side"
    body: |
      A side-by-side video comparing the same three shots graded in DaVinci Resolve (free) and Kdenlive: primary
      wheels, curves and a simple LUT workflow. Kdenlive gets surprisingly close on simple shots but its scopes are
      slower. Project files and LUTs are linked in the description. We filmed and edited it ourselves.
    content_type: video_link
