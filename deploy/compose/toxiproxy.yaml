# Toxiproxy (MIT) in front of the local Lemmy and Ghost, for fault injection (latency, timeouts, resets).
# No host ports. Control API: http://toxiproxy:8474 (internal `ibx_sandbox` network).
# Proxies (deploy/toxiproxy/toxiproxy.json):
#   lemmy_proxy  toxiproxy:18536 -> lemmy:8536
#   ghost_proxy  toxiproxy:12368 -> ghost:2368
# Add/remove toxics at runtime, e.g. POST http://toxiproxy:8474/proxies/ghost_proxy/toxics
#   {"name":"slow","type":"latency","stream":"downstream","attributes":{"latency":20000}}

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ../toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    networks: [ibx_sandbox]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ibx_sandbox:
    internal: true
