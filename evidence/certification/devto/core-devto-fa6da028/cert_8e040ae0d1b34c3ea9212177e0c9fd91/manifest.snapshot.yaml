key: devto
version: 1.0.0
tier: native
auth: api_key
surfaces:
- key: article
  content_types:
  - text
  - link
  - image
  - video_link
  spec:
    title_required: true
    title_max_chars: 128
    body_required: true
    body_max_chars: 100000
    tag_max: 4
    tag_pattern: '[a-z0-9]+'
    tag_max_chars: 30
    count_unit: codepoints
    links_allowed: true
rate_limits:
  per_connection:
    requests: 10
    per_seconds: 30.0
capabilities:
- publish
- status
- metrics
error_map:
  '401': CONNECTION_AUTH_EXPIRED
  '403': CONNECTION_AUTH_EXPIRED
  '400': PLATFORM_CONTENT_REJECTED
  '422': PLATFORM_CONTENT_REJECTED
  '429': PLATFORM_RATE_LIMIT
instance_param: base_url
