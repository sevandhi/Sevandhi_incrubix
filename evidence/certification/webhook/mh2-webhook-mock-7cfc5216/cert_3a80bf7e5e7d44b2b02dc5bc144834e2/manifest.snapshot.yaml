key: webhook
version: 1.0.0
tier: protocol
auth: api_key
surfaces:
- key: post
  content_types:
  - text
  - link
  - image
  - video
  - video_link
  spec:
    title_max_chars: 300
    body_max_chars: 100000
    links_allowed: true
rate_limits:
  per_connection:
    requests: 120
    per_seconds: 60.0
capabilities:
- publish
- status
- delete
error_map:
  400:timestamp_outside_tolerance: PLATFORM_UNAVAILABLE
  '400': PLATFORM_CONTENT_REJECTED
  '401': CONNECTION_AUTH_EXPIRED
  '403': CONNECTION_AUTH_EXPIRED
  '409': PLATFORM_CONTENT_REJECTED
  '413': PLATFORM_CONTENT_REJECTED
  '422': PLATFORM_CONTENT_REJECTED
  '429': PLATFORM_RATE_LIMIT
instance_param: endpoint_url
