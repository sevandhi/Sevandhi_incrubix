openapi: 3.1.0
info:
  title: IncuBrix Long-Tail Destination Network
  description: Connector contract (Appendix A), destination catalogue, posting rules and certification.
  version: 0.1.0
paths:
  /connector/v1/{key}/validate:
    post:
      tags:
      - connector contract
      summary: Check a rendition against the destination's limits.
      operationId: contract_validate
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResult'
        '404':
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        '409':
          content:
            application/json:
              schema: *id001
          description: Conflict
        '422':
          content:
            application/json:
              schema: *id001
          description: Unprocessable Entity
        '424':
          content:
            application/json:
              schema: *id001
          description: Failed Dependency
        '429':
          content:
            application/json:
              schema: *id001
          description: Too Many Requests
        '503':
          content:
            application/json:
              schema: *id001
          description: Service Unavailable
        '401':
          description: Missing or invalid bearer token (UNAUTHORIZED)
          content:
            application/json:
              schema: *id001
        '500':
          description: Unexpected error (INTERNAL_ERROR), with details.correlation_id
          content:
            application/json:
              schema: *id001
      security:
      - bearerAuth: []
