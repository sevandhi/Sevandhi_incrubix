components:
  schemas:
    AssistCompleteIn:
      properties:
        outcome:
          type: string
          enum:
          - posted
          - rejected_by_community
          - removed_by_community
          - abandoned
          title: Outcome
          default: posted
        reason:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Reason
        live_url:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Live Url
        platform_post_id:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Platform Post Id
        completed_by:
          type: string
          maxLength: 255
          title: Completed By
          default: human
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      title: AssistCompleteIn
      description: 'What the person reports after handling an assist pack. For an assisted destination this

        report is the only "platform" signal, so a community''s refusal or removal is recorded here.'
    AssistFile:
      properties:
        name:
          type: string
          title: Name
        url:
          type: string
          title: Url
        mime:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime
      additionalProperties: false
      type: object
      required:
      - name
      - url
      title: AssistFile
    AssistPack:
      properties:
        files:
          items:
            $ref: '#/components/schemas/AssistFile'
          type: array
          title: Files
        caption:
          type: string
          title: Caption
        deep_link:
          type: string
          title: Deep Link
        checklist:
          items:
            type: string
          type: array
          title: Checklist
      additionalProperties: false
      type: object
      required:
      - files
      - caption
      - deep_link
      - checklist
      title: AssistPack
