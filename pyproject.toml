[project]
name = "ibx-destination-network"
version = "0.1.0"
description = "IncuBrix long-tail destination network: connectors, posting rules, certification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "boto3>=1.34",
  "pyjwt>=2.8",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "lxml>=5.2",
  "feedparser>=6.0.11",
  "lingua-language-detector>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "hypothesis>=6.100",
  "testcontainers[postgres]>=4.7",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live_local: needs the docker compose stack with real Lemmy/Ghost running",
  "slow: slower tests (perf, large fixtures)",
  "live_local_full: needs the compose profile `full` (real Discourse); always combined with live_local",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
