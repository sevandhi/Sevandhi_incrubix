# Render Blueprint for the LIVE DEMO. One free Docker web service running the all-in-one demo image
# (Dockerfile.demo: API + job worker/scheduler + mock platforms, simulation only). Postgres and S3 storage are a free
# Supabase project (session pooler + Storage S3). Step-by-step: deploy/render/DEPLOY.md.
#
# Secrets: API_TOKEN and CALLBACK_SECRET are generated by Render (generateValue). DATABASE_URL, the S3 settings and
# GEMINI_API_KEY are typed into the Render dashboard when the Blueprint is created (sync: false). None of them is in
# this repository.
services:
  - type: web
    name: ibx-destination-network-demo
    runtime: docker
    plan: free
    region: singapore            # keep it next to the Supabase project's region (DEPLOY.md, step 1)
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"     # deploy on purpose (Manual Deploy), so the demo never restarts mid-review
    envVars:
      # --- generated secrets ---
      - key: API_TOKEN           # the reviewers' bearer token (Render dashboard → Environment → reveal)
        generateValue: true
      - key: CALLBACK_SECRET     # HMAC key for job callbacks (X-IncuBrix-Signature)
        generateValue: true
      # --- typed in at Blueprint creation (never committed) ---
      - key: DATABASE_URL        # Supabase SESSION pooler URI (port 5432) + ?sslmode=require
        sync: false
      - key: S3_ENDPOINT         # https://<project-ref>.storage.supabase.co/storage/v1/s3
        sync: false
      - key: S3_PUBLIC_ENDPOINT  # the same URL as S3_ENDPOINT
        sync: false
      - key: S3_REGION           # the region shown on Supabase → Storage → S3 configuration (e.g. ap-southeast-1)
        sync: false
      - key: S3_ACCESS_KEY       # Supabase → Storage → S3 access keys
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY      # optional, free tier; empty = deterministic mock extractor
        sync: false
      # --- plain settings (the rest are defaults in Dockerfile.demo) ---
      - key: APP_ENV
        value: demo
      - key: SIMULATION_MODE
        value: "true"
      - key: API_TOKEN_REQUIRED          # open demo: no bearer token; the per-IP rate limit still applies
        value: "false"
      - key: S3_BUCKET
        value: ibx
      - key: LLM_PROVIDER
        value: auto              # gemini if GEMINI_API_KEY is set, else the mock; never a paid provider
      - key: RATE_LIMIT_PER_MIN
        value: "300"             # per client IP, on /api/v1, /connector/v1 and /sim
      - key: TRUSTED_PROXIES
        value: 10.0.0.0/8        # Render's internal proxy hop; X-Forwarded-For is only believed from it
      - key: DB_POOL_SIZE
        value: "3"               # ≤ 7 Supabase session-pooler clients per instance (pool + overflow + LISTEN)
      - key: WORKER_CONCURRENCY
        value: "3"
