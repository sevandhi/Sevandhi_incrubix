  # ------------------------------------------------------------ regressions (added before the fixes)
  - id: r1_cap_and_disclosure_message_names_the_cap
    hard_case: second post inside a weekly cap
    description: "A reschedule plus a disclosure fix must report the cap in the error message, not the disclosure"
    rules: {frequency_cap: 1/P7D, disclosure_required: true}
    rendition: {ai_generated: true}
    history: [{ago: P1D}]
    expect: {action: reschedule, code: DEST_RULE_FREQUENCY_CAP, message_contains: "DEST_RULE_FREQUENCY_CAP"}
  - id: r3_shortener_on_no_promo_destination
    hard_case: promotional post to a no-promotion community
    description: "A shortener hides where it goes (maybe the creator's own site), so it counts as promotional"
    rules: {self_promo_allowed: false}
    owner_domains: [creator.dev]
    rendition: {body: "Full notes: https://bit.ly/3xYz"}
    expect: {action: block, code: DEST_RULE_SELF_PROMO, evidence_types: [shortener]}
  - id: r7_german_community_english_post_blocked
    hard_case: non-English community
    description: "A stated non-English community language implies must_match"
    rules: {language: de}
    rendition: {language: en}
    expect: {action: block, code: DEST_RULE_LANGUAGE, reason_contains: "de"}
  - id: r7_german_community_disclosure_english_post_blocked
    hard_case: non-English community that requires AI-content disclosure
    rules: {language: de, disclosure_required: true}
    rendition: {language: en, ai_generated: true}
    expect: {action: block, code: DEST_RULE_LANGUAGE}
  - id: r7_german_community_german_post_with_disclosure
    hard_case: non-English community that requires AI-content disclosure
    rules: {language: de, disclosure_required: true}
    rendition: {language: de, ai_generated: true, title: "Mein Schnitt-Workflow", body: "Ich habe einen Monat lang drei Workflows getestet."}
    expect: {action: allow_with_changes, fix_lang: de, fix_text_contains: "Hinweis"}
  - id: r7_japanese_community_undeclared_english_text_blocked
    hard_case: non-English community
    rules: {language: ja}
    rendition: {language: null}
    expect: {action: block, code: DEST_RULE_LANGUAGE, reason_contains: "detected"}
  - id: r7_tamil_community_tamil_text_detected
    hard_case: non-English community
    rules: {language: ta}
    rendition: {language: null, title: "எடிட்டிங் குறிப்புகள்", body: "வீடியோ எடிட்டிங் பற்றிய என் குறிப்புகள்."}
    expect: {action: allow}
  - id: r7_implied_policy_unknown_language_only_warns
    hard_case: non-English community
    description: with an implied (not explicit) must_match, only a definite mismatch blocks
    rules: {language: de}
    rendition: {language: null, title: "👍", body: "🎬🎬🎬"}
    expect: {action: allow, warnings_contain: "LANGUAGE_UNKNOWN"}
